apply plugin: 'com.android.application'

// The version of the release, written by app/scripts/release.js when semantic-release makes one; F-Droid reads it too.
def releaseVersion = new Properties()
file('version.properties').withInputStream { releaseVersion.load(it) }

// The release signing key, given by environment variables so that it never enters the repository. Without them, the
// release APK is built unsigned (as F-Droid builds it before comparing it with the published one).
def keystoreFile = System.getenv('OPENAMBIKE_KEYSTORE')

android {
    namespace = "org.openambike.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        // The application ID F-Droid accepts for a project on GitHub, as the project owns no domain; the Java package
        // (namespace) stays org.openambike.app, as it does not identify the app.
        applicationId "io.github.rapsssito.openambike"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode releaseVersion.getProperty('versionCode').toInteger()
        versionName releaseVersion.getProperty('versionName')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystoreFile) {
                storeFile file(keystoreFile)
                storePassword System.getenv('OPENAMBIKE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('OPENAMBIKE_SIGNING_ALIAS')
                keyPassword System.getenv('OPENAMBIKE_KEY_PASSWORD')
            }
        }
    }
    // No dependency metadata in the APK: it is a blob encrypted for Google that F-Droid refuses.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    buildTypes {
        // The debug build is an app of its own, "OpenAMBike Debug" (src/debug/res/values/strings.xml), so that it
        // installs beside the release from F-Droid or GitHub, which it would otherwise have to replace.
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            if (keystoreFile) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

